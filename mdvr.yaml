app:
  name: MDVR
  description: Browser reader for markdown vaults
server:
  unknown_keys: fail
  write_without_auth: warn
defaults:
  mode: read-only
  permissions:
    files_format_read:
      - .md
      - .excalidraw
      - .txt
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .webp
      - .bmp
      - .svg
      - .ico
      - .pdf
    files_format_edit:
      - .md
      - .excalidraw
      - .txt
    files_format_new:
      - .md
      - .excalidraw
      - .txt
vaults:
  # These are settings overlays for mounted /vaults/<id> directories.
  # Docker Compose controls which vaults actually exist.
  - id: demo
    name: Demo test vault
    path: /vaults/demo
    mode: read-write
    description: Internal vault for verifying MDVR write actions before mounting notes.
    permissions:
      delete: true
  - id: obsidian
    name: Obsidian
    path: /vaults/obsidian
    mode: read-only
    description: Optional host Obsidian vault mount. Read-only for safety.
    permissions:
      delete: false
